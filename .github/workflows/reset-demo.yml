# One-click reset of the live-demo branch: Actions → "Reset demo branch" → Run workflow.
# Force-pushes demo-start onto demo. main and baseline are never touched.
name: Reset demo branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset demo to demo-start
        run: |
          git push --force origin origin/demo-start:refs/heads/demo
          echo "demo is now at $(git rev-parse --short origin/demo-start)"
