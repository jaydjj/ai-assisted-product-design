<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*
 * Design tokens — the single source of truth for visual values.
 * Components use semantic tokens (--color-text, --status-*), never raw palette values.
 * Usage rules live in docs/design-system.md. Visual direction: docs/decisions.md D-001.
 */
:root {
  /* Palette (raw values — reference only through semantic tokens below).
     Warm-tinted neutrals; near-black, never pure black. */
  --palette-neutral-0: #ffffff;
  --palette-neutral-50: #fafaf9;
  --palette-neutral-100: #f4f4f2;
  --palette-neutral-200: #e8e7e3;
  --palette-neutral-400: #a19f98;
  --palette-neutral-600: #6b6963;
  --palette-neutral-900: #1b1a17;
  --palette-indigo-600: #4f46e5;
  --palette-indigo-100: #e9e8fd;
  --palette-green-700: #1d7a4f;
  --palette-green-100: #e6f4ec;
  --palette-amber-700: #8f5b05;
  --palette-amber-100: #fcf1d9;
  --palette-red-700: #b3261e;
  --palette-red-100: #fbe9e7;
  --palette-blue-700: #2a5db0;
  --palette-blue-100: #e6eefb;

  /* Surface & text */
  --color-bg: var(--palette-neutral-50);
  --color-surface: var(--palette-neutral-0);
  --color-surface-muted: var(--palette-neutral-100);
  --color-text: var(--palette-neutral-900);
  --color-text-muted: var(--palette-neutral-600);
  --color-text-subtle: var(--palette-neutral-400);
  --color-accent: var(--palette-indigo-600);
  --color-accent-subtle: var(--palette-indigo-100);

  /* Hairline borders: containment comes from 1px lines, not shadows. */
  --color-border: rgba(27, 26, 23, 0.1);
  --color-border-subtle: rgba(27, 26, 23, 0.06);
  --ring-hairline: 0 0 0 1px var(--color-border);

  /* Status (foreground on tinted background; meets 4.5:1 contrast) */
  --status-on-track-fg: var(--palette-green-700);
  --status-on-track-bg: var(--palette-green-100);
  --status-at-risk-fg: var(--palette-amber-700);
  --status-at-risk-bg: var(--palette-amber-100);
  --status-off-track-fg: var(--palette-red-700);
  --status-off-track-bg: var(--palette-red-100);
  --status-on-hold-fg: var(--palette-neutral-600);
  --status-on-hold-bg: var(--palette-neutral-100);
  --status-completed-fg: var(--palette-blue-700);
  --status-completed-bg: var(--palette-blue-100);

  /* Signals: computed facts the system points at (D-006). Separate from status so
     the two vocabularies stay distinct even where the hue is close. */
  --signal-critical-fg: var(--palette-red-700);

  /* Typography — Inter for everything; numerals are tabular in data contexts. */
  --font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-family-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-size-xs: 0.75rem;    /* 12px — badges, column headers */
  --font-size-sm: 0.8125rem;  /* 13px — table body, dense UI */
  --font-size-md: 0.875rem;   /* 14px — default body */
  --font-size-lg: 1.125rem;   /* 18px */
  --font-size-xl: 1.5rem;     /* 24px — page title */
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --tracking-tight: -0.02em;  /* display/headings */
  --tracking-caps: 0.06em;    /* uppercase labels */

  /* Spacing (4px scale) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* Shape */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-pill: 999px;

  /* Layout */
  --content-max-width: 1120px;
  --row-height: 44px;
}

*{box-sizing:border-box}
body{margin:0;font-family:var(--font-family);font-size:var(--font-size-md);line-height:var(--line-height-normal);color:var(--color-text);background:var(--color-bg);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-7)}
nav{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-6);font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps)}
nav a{color:var(--color-text-muted);text-decoration:none;padding:4px 10px;border-radius:var(--radius-pill);box-shadow:var(--ring-hairline);background:var(--color-surface)}
nav a[aria-current]{color:var(--color-text);background:var(--color-surface-muted)}
nav a.app{margin-left:auto;color:var(--color-accent)}
h1{font-size:var(--font-size-xl);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tight);margin:0 0 var(--space-4)}
h2{font-size:var(--font-size-lg);font-weight:var(--font-weight-semibold);letter-spacing:var(--tracking-tight);margin:var(--space-6) 0 var(--space-3);padding-top:var(--space-5);border-top:1px solid var(--color-border)}
h3{font-size:var(--font-size-md);font-weight:var(--font-weight-semibold);margin:var(--space-5) 0 var(--space-2)}
p,ul,ol{margin:0 0 var(--space-3)} li{margin-bottom:var(--space-1)}
blockquote{margin:0 0 var(--space-4);padding:var(--space-3) var(--space-4);background:var(--color-surface);box-shadow:var(--ring-hairline);border-radius:var(--radius-md);color:var(--color-text-muted);font-size:var(--font-size-sm)}
code{font-family:var(--font-family-mono);font-size:0.85em;background:var(--color-surface-muted);padding:1px 5px;border-radius:var(--radius-sm)}
table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);margin:0 0 var(--space-4);background:var(--color-surface);box-shadow:var(--ring-hairline);border-radius:var(--radius-md)}
th,td{text-align:left;padding:var(--space-2) var(--space-3);vertical-align:top;border-top:1px solid var(--color-border-subtle)}
th{font-size:var(--font-size-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--color-text-muted);border-top:0}
hr{border:0;border-top:1px solid var(--color-border);margin:var(--space-6) 0}
a{color:var(--color-accent)}
em{color:var(--color-text-muted)}
</style></head><body><div class="wrap">
